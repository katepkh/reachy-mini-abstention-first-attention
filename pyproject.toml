[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy-mini-abstention-first-attention"
version = "0.1.0"
description = "Privacy-minimal selective speaker grounding and runtime-gated head motion for Reachy Mini"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "cryptography>=42",
  "numpy>=1.26",
  "pandas>=2.2",
  "requests>=2.31",
  "websockets>=12",
]

[project.urls]
Repository = "https://github.com/katepkh/reachy-mini-abstention-first-attention"
Documentation = "https://github.com/katepkh/reachy-mini-abstention-first-attention/tree/main/docs"

[project.optional-dependencies]
live = [
  "aiohttp>=3.9",
  "aiortc>=1.9",
  "opencv-python-headless>=4.10",
]
test = [
  "aiortc>=1.9",
  "opencv-python-headless>=4.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "reachy_doa*",
  "reachy_stage2a*",
  "reachy_stage3a*",
  "reachy_stage3v*",
  "reachy_stage3p*",
  "reachy_stage4*",
]
