<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
<title id="title">Stage 2A passive safety-coverage frontier</title>
<desc id="desc">Development and retrospective evaluation plots compare tracked matching coverage against tracked hard-negative false confirmation. Upper left is preferable. The development-selected three-hit policy is marked with a star.</desc>
